global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/agentops.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: agentops-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://caddy:80/health/ready']
        labels:
          target: agentops-ready-internal
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
