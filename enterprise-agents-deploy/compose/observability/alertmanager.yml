global:
  resolve_timeout: 5m
  smtp_require_tls: true
route:
  receiver: unconfigured-receiver
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: unconfigured-receiver
receivers:
  - name: unconfigured-receiver
# Intentionally no external receiver. Production promotion MUST fail until the operator
# configures and fires a real alert to a verified destination (email, PagerDuty etc).
