name: Frontend quality, accessibility and supply chain
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require authentic lockfile
        run: test -s package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Biome
        run: npm run lint
      - name: Typecheck and bundle
        run: npm run build
      - name: React unit and component tests
        run: npm run test:unit
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high
  browser-e2e:
    # Runs only for explicitly configured staging URL; release workflow must require this job.
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test -s package-lock.json && npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E with WCAG checks against real staging
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run test:e2e
